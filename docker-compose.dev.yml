name: himti-regis-frontend-dev

services:
  app:
    build:
      context: .
      target: development
    image: himti-regis-frontend:dev
    container_name: himti-regis-frontend-dev
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--port", "3001"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    volumes:
      - .:/app
      - /app/node_modules
